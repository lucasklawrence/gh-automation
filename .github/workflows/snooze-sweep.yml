name: snooze-sweep (reusable)

# Reusable snooze sweep — the shared "plugin" (life#159 logic, org-wide per life#267).
#
# Any repo adopts it with a ~10-line caller workflow that `uses:` this file on a daily cron. Label
# an issue `snoozed` + put a `snooze: YYYY-MM-DD` line in its body; once that date passes, the daily
# run drops the label and @-mentions the author (-> GitHub notification email). The `snoozed` label
# is created automatically on first run, so adopting == just adding the caller.
#
# Runs in the CALLER's context with the caller's GITHUB_TOKEN, so it only ever touches the caller
# repo's own issues. Public repo -> consumable by public and private callers alike.

on:
  workflow_call:
    inputs:
      label:
        description: Label that marks a snoozed issue.
        type: string
        default: snoozed

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      issues: write # create the label if missing, remove it, post the wake-up comment
    steps:
      - name: Ensure the snooze label exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ inputs.label }}
        run: |
          gh label create "$LABEL" \
            --color FBCA04 \
            --description "Deferred until the snooze: YYYY-MM-DD date in the body" \
            && echo "created label '$LABEL'" \
            || echo "label '$LABEL' already exists — ok"
      - name: Check out the plugin (its own sweep script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: lucasklawrence/gh-automation
          path: .gh-automation
      - name: Sweep snoozed issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNOOZE_LABEL: ${{ inputs.label }}
        run: python3 .gh-automation/snooze_sweep.py
